# Agent metadata
agent_name: 'sap_abap_agent_v2'
agent_display_name: 'SAP ABAP ADK Agent V3'
agent_description: 'SAP ABAP Code Agent in Google Cloud'

# ---------------------------------------------------------------------------
# Deployment settings consumed by scripts/deploy_agent_engine.py.
# CLI arguments override anything defined here.
# ---------------------------------------------------------------------------
deploy:
  display_name: 'SAP ABAP Agent V2'

  # GCS bucket for Vertex AI Agent Engine packaging (vertexai.init staging_bucket).
  # If omitted, uses deploy.env_vars.GOOGLE_CLOUD_BUCKET, then gs://<project>_cloudbuild.
  staging_bucket: gs://adt-sap-agent-engine-bucket

  # --- Connectivity (PSC) ---
  # false: public/default Agent Engine networking (no psc_interface_config).
  # true:  attach to the PSC network attachment below.
  use_network_attachment: false
  # Full resource path or short attachment name (default: agent-engine-attachment).
  # network_attachment: agent-engine-attachment

  # --- Runtime identity ---
  # false: omit service_account from the API (project default runtime identity).
  # true:  use deploy.service_account or agent-engine-sa@<project>.iam.gserviceaccount.com.
  use_service_account: false
  # service_account: sap-agent-abap

  # --- Credentials ---
  # config:          SAP_* and related vars come only from deploy.env_vars below.
  # secret_manager:  load JSON from Secret Manager (deploy.credentials_secret).
  secrets_source: config
  # credentials_secret: sap-agent-abap

  min_instances: 1
  max_instances: 10

  agent_attr: 'root_agent'

  resource_limits:
    cpu: '4'
    memory: '8Gi'

  extra_packages:
    - './sap_abap_agent_v2'

  env_vars:
    SAP_LANGUAGE: 'EN'
    GOOGLE_CLOUD_AGENT_ENGINE_ENABLE_TELEMETRY: 'true'
    OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT: 'true'
    SAP_URL: 'http://ecc-xe1.camanchaca.cl/sap/bc/adt?saml2=disabled'
    SAP_USERNAME: 'S-PICPI'
    SAP_PASSWORD: 'Bt1419042.2026'
    SAP_CLIENT: '300'
    GOOGLE_CLOUD_LOCATION: 'global'
    GOOGLE_CLOUD_BUCKET: 'gs://adt-sap-agent-engine-bucket'
    GOOGLE_GENAI_USE_VERTEXAI: 'TRUE'

  # Pinned to match uv.lock (Python 3.11 runtime on Agent Engine).
  requirements:
    - 'google-cloud-aiplatform[adk,agent_engines]==1.153.1'
    - 'google-adk==1.34.1'
    - 'google-cloud-secret-manager==2.28.0'
    - 'pydantic==2.12.5'
    - 'pydantic-settings==2.14.1'
    - 'aiohttp==3.13.4'
    - 'tenacity==9.1.4'
    - 'authlib==1.7.2'
    - 'cryptography==48.0.0'
    - 'xmltodict==0.15.1'
    - 'pyyaml==6.0.3'
    - 'python-dotenv==1.2.2'
    - 'nest-asyncio==1.6.0'
