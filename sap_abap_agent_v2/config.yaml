# Agent metadata
agent_name: 'sap_abap_agent_v2'
agent_display_name: 'SAP ABAP ADK Agent V2'
agent_description: 'SAP ABAP Code Agent in Google Cloud'

# ---------------------------------------------------------------------------
# Deployment settings consumed by scripts/deploy_agent_engine.py.
# CLI arguments to that script override anything defined here.
# Infrastructure-specific values (project, region, service account,
# network attachment, secret name, etc.) still come from Terraform / CLI.
# ---------------------------------------------------------------------------
deploy:
  # Display name shown in the Vertex AI Agent Engine console.
  display_name: 'SAP Agent'

  # Attribute name of the root agent inside <agent_name>/agent.py.
  agent_attr: 'root_agent'

  # Container resource limits.
  # Supported: cpu in {"1","2","4","6","8"}, memory in "1Gi" .. "32Gi".
  resource_limits:
    cpu: '4'
    memory: '8Gi'

  # Local packages to bundle into the Agent Engine container.
  # Defaults to ["./<agent_name>"] when omitted.
  extra_packages:
    - './sap_abap_agent_v2'

  # Non-secret environment variables merged into the deployment.
  # Secret-derived env vars (SAP_*, AUTH_SERVER_URL) are added by the
  # deploy script from Secret Manager and do NOT belong here.
  env_vars: 
    SAP_LANGUAGE: 'EN'
    GOOGLE_CLOUD_AGENT_ENGINE_ENABLE_TELEMETRY: 'true'
    OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT: 'true'
    # GOOGLE_GENAI_USE_VERTEXAI: 'TRUE'
  # Python requirements installed inside the Agent Engine container.
  requirements:
    - 'google-cloud-aiplatform[adk,agent_engines]>=1.128.0'
    - 'google-adk>=1.27.0'
    - 'google-cloud-secret-manager>=2.16.0'
    - 'pydantic>=2.5.0'
    - 'pydantic-settings>=2.1.0'
    - 'aiohttp>=3.9.0'
    - 'asyncio-throttle>=1.0.2'
    - 'structlog>=23.2.0'
    - 'tenacity>=8.2.3'
    - 'authlib>=1.3.0'
    - 'cryptography>=41.0.7'
    - 'xmltodict>=0.13.0'
    - 'pyyaml>=6.0.1'
    - 'python-dotenv>=1.0.0'
    - 'nest-asyncio>=1.5.0'
